version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: agentforge_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: urlshortener
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: agentforge_redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  url_shortener:
    build:
      context: ./reference_app/url_shortener
      dockerfile: Dockerfile
    container_name: agentforge_url_shortener
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/urlshortener
      REDIS_URL: redis://redis:6379/0
      REDIS_ENABLED: "true"
      BASE_URL: http://localhost:8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
