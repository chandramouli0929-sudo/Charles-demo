name: AgentForge CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check app/ tests/ reference_app/ --output-format=github

      - name: Type check with mypy
        run: mypy app/ --ignore-missing-imports
        continue-on-error: true  # Non-blocking for now

      - name: Run unit tests (no API key needed)
        run: pytest tests/unit/ -v --tb=short
        env:
          LLM_PROVIDER: gemini
          LLM_API_KEY: fake-key-for-ci
          LLM_MODEL: gemini-1.5-flash
          DATABASE_URL: sqlite+aiosqlite:///./test.db

      - name: Run URL shortener tests
        run: pytest reference_app/url_shortener/tests/ -v --tb=short
        env:
          DATABASE_URL: sqlite+aiosqlite:///./test_url_shortener.db
          REDIS_ENABLED: "false"
          BASE_URL: "http://localhost:8000"

      - name: Build check
        run: python -c "from app.config import settings; print('Config OK')"
        env:
          LLM_API_KEY: fake-key-for-ci
          DATABASE_URL: sqlite+aiosqlite:///./test.db

  docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t agentforge-url-shortener ./reference_app/url_shortener

      - name: Verify image
        run: docker image inspect agentforge-url-shortener
